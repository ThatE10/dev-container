name: Promote draft

# Promotes the staged draft (paper/paper.staged.tex) to the canonical
# paper/paper.tex and opens a single-file pull request for the user to review
# and merge in the web UI. This is the ONLY sanctioned path by which the
# canonical draft changes.
#
# The user triggers this manually from the Actions tab (Run workflow).
on:
  workflow_dispatch:

# The default GITHUB_TOKEN is used only for checkout. The pull request itself is
# opened with a fine-grained PAT (secret PROMOTE_TOKEN) so that required status
# checks run on it -- pull requests opened by GITHUB_TOKEN do NOT trigger other
# workflows, which would leave the draft-isolation check pending forever.
permissions:
  contents: read

jobs:
  promote:
    name: Promote staged draft to canonical
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Decide whether there is anything to promote
        id: check
        run: |
          set -euo pipefail
          if [ ! -f paper/paper.staged.tex ]; then
            echo "::notice title=Nothing to promote::paper/paper.staged.tex does not exist; nothing to promote."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          elif cmp -s paper/paper.staged.tex paper/paper.tex; then
            echo "::notice title=Nothing to promote::paper/paper.staged.tex is identical to paper/paper.tex; nothing to promote."
            echo "promote=false" >> "$GITHUB_OUTPUT"
          else
            echo "Staged draft differs from canonical; promotion will proceed."
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute promotion branch name
        if: steps.check.outputs.promote == 'true'
        id: meta
        run: |
          set -euo pipefail
          echo "branch=paper-promote/$(date -u +%Y%m%d-%H%M%S)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Set up pandoc
        if: steps.check.outputs.promote == 'true'
        uses: pandoc/actions/setup@v1
        with:
          version: 3.1.11

      - name: Promote staged -> canonical and regenerate Markdown
        if: steps.check.outputs.promote == 'true'
        run: |
          set -euo pipefail
          cp paper/paper.staged.tex paper/paper.tex
          pandoc paper/paper.tex --from=latex --to=gfm --output=paper/paper.md
          echo "Regenerated paper/paper.md from the promoted paper/paper.tex."

      - name: Open promotion pull request
        if: steps.check.outputs.promote == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          # Fine-grained PAT (Contents + Pull requests: read/write). NOT the
          # default GITHUB_TOKEN -- see the permissions note at the top.
          token: ${{ secrets.PROMOTE_TOKEN }}
          branch: ${{ steps.meta.outputs.branch }}
          base: main
          # Commit ONLY the two promotion artifacts, nothing else in the tree.
          add-paths: |
            paper/paper.tex
            paper/paper.md
          commit-message: "Promote staged draft to canonical paper.tex (${{ steps.meta.outputs.date }})"
          title: "Promote draft: paper.tex (${{ steps.meta.outputs.date }})"
          delete-branch: true
          body: |
            Automated promotion of `paper/paper.staged.tex` to the canonical
            `paper/paper.tex`, with `paper/paper.md` regenerated via pandoc.

            This PR touches only `paper/paper.tex` and `paper/paper.md`, so it
            satisfies the draft-isolation check. Review the LaTeX diff and merge
            in the web UI to publish the new canonical draft.

            ---
            _Generated by [Claude Code](https://claude.ai/code)_
